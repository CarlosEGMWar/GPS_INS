name: compilar

# Compila el firmware en una maquina LIMPIA, sin nada preinstalado.
#
# El objetivo no es solo saber que compila: es ejercitar preparar.sh en la
# situacion de alguien que acaba de clonar el repo. En la maquina de desarrollo
# el toolchain y las dependencias ya estan, asi que esos caminos del script no
# se prueban nunca. Aqui si.
#
# A proposito NO se instala nada con apt ni con setup-python: todo lo tiene que
# resolver preparar.sh, igual que en el equipo de quien clona.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
  workflow_dispatch:          # se puede lanzar a mano desde la pestana Actions

# No hay compilacion programada: se compila cuando tu lo pides, no un dia fijo.
#
# Lo unico que se pierde es el aviso temprano de que el ENTORNO se pudrio: aqui
# nada esta congelado del todo (el toolchain se descarga, pip instala
# em/pymavlink/intelhex sin version fija, y GitHub cambia la imagen de
# ubuntu-latest). Puede dejar de compilar sin que cambie una linea del repo.
# Si pasa, se vera en el siguiente push o al publicar, no antes.

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Clonar el repo de la cola
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # trae las etiquetas: sin ellas manifest.json
                               # apunta sby_tag a null y se pierde la traza

      - name: Cache del compilador ARM
        uses: actions/cache@v4
        with:
          path: ~/opt
          key: toolchain-gcc-arm-none-eabi-10-2020-q4-major

      - name: Que version de ArduPilot vamos a usar
        run: |
          echo "UPSTREAM dice:"
          cat UPSTREAM | sed 's/^/  /'

      - name: Compilar (preparar.sh monta el entorno solo)
        run: ./scripts/actualizar.sh

      - name: Que se genero
        run: |
          ls -la dist/ | sed 's/^/  /'
          echo
          echo "--- manifest ---"
          cat dist/manifest.json

      - name: Guardar los binarios
        uses: actions/upload-artifact@v4
        with:
          name: firmware-SBY_GPS_INS
          path: |
            dist/*.hex
            dist/*.bin
            dist/*.apj
            dist/manifest.json
          retention-days: 30
