name: publicar release

# Se dispara con una etiqueta  Rover-<version>-SBY-<version>  y publica los tres
# formatos de grabacion.
#
#     ./scripts/publicar.sh 1.2.0      ->  Rover-4.7.1-SBY-1.2.0
#
# La etiqueta lleva las dos versiones: contra que ArduPilot se construyo y que
# version del firmware de SBY es. Se lee de un vistazo, sin abrir nada. Es
# tambien la UNICA fuente de esa informacion: el repo no guarda en ningun
# archivo contra que version de ArduPilot se compila.
#
# Compilar aqui y no en la maquina de alguien tiene una ventaja concreta: los
# binarios publicados salen de un entorno limpio y reproducible.

on:
  push:
    tags: ['Rover-*-SBY-*']
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta a publicar (ej: Rover-4.7.1-SBY-1.2.0). Tiene que existir ya.'
        required: true

permissions:
  contents: write             # necesario para crear la release

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Clonar el repo de la cola
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.etiqueta || github.ref }}
          fetch-depth: 0       # trae las etiquetas y el historial completo

      - name: Cache del compilador ARM
        uses: actions/cache@v4
        with:
          path: ~/opt
          key: toolchain-gcc-arm-none-eabi-10-2020-q4-major

      - name: Que ArduPilot pide la etiqueta
        run: |
          ETQ="${{ github.event.inputs.etiqueta || github.ref_name }}"
          echo "ETQ=$ETQ"                 >> "$GITHUB_ENV"
          echo "AP_TAG=${ETQ%%-SBY-*}"    >> "$GITHUB_ENV"
          echo "SBY_VER=${ETQ##*-SBY-}"   >> "$GITHUB_ENV"
          echo "  etiqueta   $ETQ"
          echo "  ArduPilot  ${ETQ%%-SBY-*}"
          echo "  SBY        ${ETQ##*-SBY-}"

      - name: Compilar contra esa version de ArduPilot
        run: ./scripts/actualizar.sh "$AP_TAG"

      - name: Comprobar reproducibilidad
        run: |
          # Sin manifest: los datos se calculan aqui, que es donde se usan.
          if [ -n "$(git status --porcelain)" ]; then
              echo "::error::el repo tiene cambios sin commitear: este binario no es reproducible"
              git status --short
              exit 1
          fi
          # La etiqueta promete una version de ArduPilot: que sea la que se uso.
          AP_REAL=$(bash -c '. scripts/interno/comun.sh >/dev/null 2>&1; version_ardupilot')
          if [ "$AP_REAL" != "$AP_TAG" ]; then
              echo "::error::la etiqueta dice $AP_TAG pero se compilo contra $AP_REAL"
              exit 1
          fi
          echo "reproducible desde $(git rev-parse --short HEAD), sobre $AP_REAL"

      - name: Notas de la release
        run: |
          SBY_COMMIT=$(git rev-parse --short HEAD)
          {
            echo "Firmware de la placa **SBY GPS G3.1**, construido sobre **ArduPilot $AP_TAG**."
            echo
            echo "Compilado en un entorno limpio desde el commit \`$SBY_COMMIT\`."
            echo
            echo "## Que descargar"
            echo
            echo "Los tres ficheros llevan **el mismo firmware**. Elegir segun como se vaya a grabar."
            echo
            echo "| Fichero | Herramienta | Direccion |"
            echo "|---|---|---|"
            echo "| \`ardurover_with_bl.hex\` | ST-LINK / SWD | la lleva dentro |"
            echo "| \`ardurover_with_bl.bin\` | DFU por USB, o cable serie tras \`\$GO_BOOT\` | \`0x08000000\` |"
            echo "| \`ardurover.apj\` | Mission Planner o \`uploader.py\`, por USB **o por USART1** | implicita |"
            echo
            echo "> La via del \`.apj\` es la mas segura: escribe **solo la aplicacion** y no toca"
            echo "> el bootloader, asi que si falla a medias la placa sigue siendo recuperable."
            echo
            echo "## Como se graba"
            echo
            echo '```bash'
            echo "# ST-LINK / SWD  (produccion; graba bootloader + aplicacion)"
            echo "STM32_Programmer_CLI -c port=SWD mode=UR -w ardurover_with_bl.hex -v -rst"
            echo
            echo "# ArduPilot: por USB, o por el UART del GPS (USART1) a 115200 8-N-1"
            echo "python uploader.py --port COMx --baud-bootloader 115200 ardurover.apj"
            echo
            echo "# DFU  (recuperacion; BOOT0 en alto + reset -> 0483:df11)"
            echo "dfu-util -a 0 -d 0483:df11 -s 0x08000000:leave -D ardurover_with_bl.bin"
            echo '```'
            echo
            echo "Por USART1 caben **dos protocolos distintos**: el \`.apj\` habla con el"
            echo "bootloader de ArduPilot (8-N-1, escribe solo la aplicacion) y el \`.bin\` con el"
            echo "ROM del micro (8-EVEN-1, reescribe todo, bootloader incluido)."
            echo
            echo "## Huellas SHA-256"
            echo
            echo "Conviene comprobarlas antes de grabar, por si la descarga se corrompio:"
            echo
            echo '```'
            ( cd dist && sha256sum ardurover_with_bl.hex ardurover_with_bl.bin ardurover.apj )
            echo '```'
            echo
            echo '```'
            echo "ArduPilot     $AP_TAG"
            echo "SBY           $SBY_VER   (commit $SBY_COMMIT)"
            ( cd dist && stat -c '%-24n %s B' ardurover_with_bl.hex ardurover_with_bl.bin ardurover.apj )
            echo '```'
            echo
            echo "---"
            echo "Como se construye: [README](https://github.com/${{ github.repository }}#readme)"
          } > notas.md
          cat notas.md

      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$ETQ" \
            --title "$ETQ" \
            --notes-file notas.md \
            dist/ardurover_with_bl.hex \
            dist/ardurover_with_bl.bin \
            dist/ardurover.apj
